name: Feature request
description: Suggest a new feature or an improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Check the [roadmap](https://kickjs.app/guide/roadmap) and open issues first — it may be planned already.

  - type: dropdown
    id: package
    attributes:
      label: Package
      description: Where it would live.
      multiple: true
      options:
        - "@forinda/kickjs"
        - "@forinda/kickjs-ai"
        - "@forinda/kickjs-cli"
        - "@forinda/kickjs-cli-kit"
        - "@forinda/kickjs-client"
        - "@forinda/kickjs-db"
        - "@forinda/kickjs-devtools"
        - "@forinda/kickjs-devtools-kit"
        - "@forinda/kickjs-di"
        - "@forinda/kickjs-grpc"
        - "@forinda/kickjs-inertia"
        - "@forinda/kickjs-lint"
        - "@forinda/kickjs-mcp"
        - "@forinda/kickjs-queue"
        - "@forinda/kickjs-schema"
        - "@forinda/kickjs-storage"
        - "@forinda/kickjs-swagger"
        - "@forinda/kickjs-testing"
        - "@forinda/kickjs-vite"
        - "@forinda/kickjs-ws"
        - "A new package"
        - "Documentation"
        - "Not sure"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you're trying to do, and what gets in the way today.
      placeholder: "When I …, I have to …, because KickJS doesn't …"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How you'd like it to work. A sketch of the API helps.
      placeholder: |
        ```ts
        // How you'd use it
        ```
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you use now, or how other frameworks solve it.
    validations:
      required: false

  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd like to open a pull request for this.
          required: false
