name: Bug report
description: Something in KickJS doesn't work as documented
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. A small reproduction is the fastest way to a fix.
        For a security issue, don't open an issue — [report it privately](https://github.com/forinda/kick-js/security/advisories/new).

  - type: dropdown
    id: package
    attributes:
      label: Package
      description: Which package is it in? `@forinda/kickjs` is the framework itself.
      multiple: true
      options:
        - "@forinda/kickjs"
        - "@forinda/kickjs-ai"
        - "@forinda/kickjs-cli"
        - "@forinda/kickjs-cli-kit"
        - "@forinda/kickjs-client"
        - "@forinda/kickjs-db"
        - "@forinda/kickjs-devtools"
        - "@forinda/kickjs-devtools-kit"
        - "@forinda/kickjs-di"
        - "@forinda/kickjs-grpc"
        - "@forinda/kickjs-inertia"
        - "@forinda/kickjs-lint"
        - "@forinda/kickjs-mcp"
        - "@forinda/kickjs-queue"
        - "@forinda/kickjs-schema"
        - "@forinda/kickjs-storage"
        - "@forinda/kickjs-swagger"
        - "@forinda/kickjs-testing"
        - "@forinda/kickjs-vite"
        - "@forinda/kickjs-ws"
        - "Not sure"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The affected package's version — `pnpm why @forinda/kickjs` (or `npm ls`) shows it.
      placeholder: "10.5.0"
    validations:
      required: true

  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      description: Which HTTP engine the app runs on, if it matters.
      options:
        - "Express (the default)"
        - "Fastify"
        - "h3"
        - "Web entry (createWebApp — Workers, Bun, Deno)"
        - "Serverless (Netlify / Vercel)"
        - "Not applicable / not sure"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead — with the error message or stack trace.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: A link to a minimal repository, or the smallest code and steps that show it.
      placeholder: |
        1. `kick new demo --yes` then `kick g module users`
        2. In the generated controller, add …
        3. `kick dev`, then `curl localhost:3000/api/v1/users`
        4. The response is … instead of …
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        - Node.js (or Bun / Deno) version:
        - OS:
        - Package manager and version:
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Logs, screenshots, or what you've already tried.
    validations:
      required: false
