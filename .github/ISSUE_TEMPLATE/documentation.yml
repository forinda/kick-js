name: Documentation
description: Something in the docs is wrong, missing or unclear
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - "Wrong or out of date"
        - "Missing"
        - "Unclear"
        - "Broken link or example"
        - "Typo"
    validations:
      required: true

  - type: input
    id: page
    attributes:
      label: Page
      description: The URL or the file under `docs/`.
      placeholder: "https://kickjs.app/guide/getting-started"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What's wrong, and what it should say
    validations:
      required: true
